<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Apex Circuit - Mobile & PC Multiplayer Racer</title>
  <style>
    :root {
      --bg: #090d16;
      --panel: #131d2e;
      --accent: #38bdf8;
      --green: #22c55e;
      --red: #ef4444;
      --text: #f8fafc;
      --muted: #64748b;
    }
    * { 
      box-sizing: border-box; 
      font-family: system-ui, -apple-system, sans-serif; 
      margin: 0; 
      padding: 0; 
      -webkit-touch-callout: none;
      -webkit-user-select: none;
      user-select: none;
    }
    body {
      background: var(--bg);
      color: var(--text);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      overflow-x: hidden;
      touch-action: manipulation;
    }

    /* Lobby Panels */
    .panel {
      background: var(--panel);
      border: 1px solid #1e293b;
      border-radius: 14px;
      padding: 1.5rem;
      width: 90%;
      max-width: 420px;
      box-shadow: 0 15px 35px rgba(0, 0, 0, 0.6);
      text-align: center;
    }
    h1 { font-size: 1.7rem; margin-bottom: 0.25rem; color: var(--accent); letter-spacing: 1px; }
    p.sub { color: var(--muted); font-size: 0.85rem; margin-bottom: 1.25rem; }

    .tabs { display: flex; gap: 8px; margin-bottom: 1.25rem; }
    .tab {
      flex: 1;
      padding: 0.65rem;
      border-radius: 8px;
      background: #0f172a;
      border: 1px solid #334155;
      color: var(--text);
      cursor: pointer;
      font-weight: 600;
    }
    .tab.active { background: var(--accent); color: #090d16; border-color: var(--accent); }

    input, select, button {
      width: 100%;
      padding: 0.75rem;
      border-radius: 8px;
      border: 1px solid #334155;
      background: #0b1120;
      color: var(--text);
      font-size: 0.95rem;
      margin-bottom: 0.85rem;
    }
    input:focus, select:focus { outline: none; border-color: var(--accent); }

    button.btn-action {
      background: var(--accent);
      color: #090d16;
      font-weight: 700;
      border: none;
      cursor: pointer;
      padding: 0.85rem;
      transition: opacity 0.2s;
    }
    button.btn-action:hover { opacity: 0.9; }

    .code-box {
      background: #090d16;
      border: 2px dashed var(--accent);
      border-radius: 8px;
      padding: 0.85rem;
      font-size: 2.2rem;
      font-weight: 800;
      letter-spacing: 6px;
      color: var(--accent);
      margin: 1rem 0;
    }

    /* Game View */
    #game-container {
      display: none;
      flex-direction: column;
      align-items: center;
      width: 100%;
      max-width: 900px;
      padding: 0.5rem;
    }
    .hud {
      display: flex;
      justify-content: space-between;
      width: 100%;
      max-width: 880px;
      padding: 0.4rem 0.8rem;
      font-weight: 600;
      font-size: 0.85rem;
      color: var(--muted);
    }
    .hud span b { color: var(--text); }
    
    .canvas-wrapper {
      width: 100%;
      max-width: 880px;
      position: relative;
    }
    canvas {
      background: #14532d;
      border: 2px solid #334155;
      border-radius: 12px;
      width: 100%;
      height: auto;
      display: block;
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.5);
    }

    /* Mobile Controls Layout */
    .mobile-controls {
      display: flex;
      justify-content: space-between;
      align-items: center;
      width: 100%;
      max-width: 880px;
      margin-top: 0.8rem;
      padding: 0 0.5rem;
    }
    .ctrl-group {
      display: flex;
      gap: 12px;
    }
    .touch-btn {
      width: 68px;
      height: 68px;
      border-radius: 50%;
      background: rgba(30, 41, 59, 0.85);
      border: 2px solid #475569;
      color: #f8fafc;
      font-size: 1.5rem;
      font-weight: bold;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      user-select: none;
      touch-action: none;
      box-shadow: 0 4px 10px rgba(0,0,0,0.4);
    }
    .touch-btn:active, .touch-btn.active {
      background: var(--accent);
      color: #090d16;
      border-color: var(--accent);
      transform: scale(0.95);
    }
    .touch-btn.gas:active, .touch-btn.gas.active {
      background: var(--green);
      color: #fff;
      border-color: var(--green);
    }
    .touch-btn.brake:active, .touch-btn.brake.active {
      background: var(--red);
      color: #fff;
      border-color: var(--red);
    }

    .keyboard-hint {
      color: var(--muted);
      font-size: 0.75rem;
      margin-top: 0.4rem;
      text-align: center;
    }
    .hidden { display: none !important; }
  </style>
</head>
<body>

  <!-- MATCHMAKING LOBBY -->
  <div class="panel" id="lobby-panel">
    <h1>APEX CIRCUIT</h1>
    <p class="sub">Play on Mobile or PC</p>

    <div class="tabs">
      <button class="tab active" id="tab-create">Create Match</button>
      <button class="tab" id="tab-join">Join Match</button>
    </div>

    <!-- Create Room Tab -->
    <div id="section-create">
      <input type="text" id="create-name" placeholder="Driver Name" maxlength="12" value="Player 1" />
      <select id="create-vehicle">
        <option value="car">🏎️ Sports Car (High Top Speed)</option>
        <option value="bike">🏍️ Racing Bike (Fast Turn & Launch)</option>
      </select>
      <button class="btn-action" id="btn-create">Generate Room Code</button>
    </div>

    <!-- Join Room Tab -->
    <div id="section-join" class="hidden">
      <input type="text" id="join-name" placeholder="Driver Name" maxlength="12" value="Player 2" />
      <select id="join-vehicle">
        <option value="car">🏎️ Sports Car (High Top Speed)</option>
        <option value="bike">🏍️ Racing Bike (Fast Turn & Launch)</option>
      </select>
      <input type="text" id="join-code" placeholder="Enter 4-Letter Code" maxlength="4" style="text-transform: uppercase;" />
      <button class="btn-action" id="btn-join">Enter Race</button>
    </div>

    <!-- Waiting Screen -->
    <div id="section-waiting" class="hidden">
      <p style="font-size: 0.85rem; color: var(--muted);">Share this room code with your friend:</p>
      <div class="code-box" id="show-room-code">----</div>
      <p style="font-size: 0.8rem; color: var(--accent);">Waiting for opponent to connect...</p>
    </div>
  </div>

  <!-- GAME ARENA -->
  <div id="game-container">
    <div class="hud">
      <span>Driver: <b id="hud-name">-</b></span>
      <span>Vehicle: <b id="hud-vehicle">-</b></span>
      <span>Speed: <b id="hud-speed">0</b> km/h</span>
      <span>Lap: <b id="hud-lap">1/3</b></span>
    </div>

    <div class="canvas-wrapper">
      <canvas id="raceTrack" width="880" height="520"></canvas>
    </div>

    <!-- Mobile Touch Controls -->
    <div class="mobile-controls">
      <!-- Steering Left / Right -->
      <div class="ctrl-group">
        <div class="touch-btn" id="btn-left">◀</div>
        <div class="touch-btn" id="btn-right">▶</div>
      </div>
      <!-- Gas / Brake -->
      <div class="ctrl-group">
        <div class="touch-btn brake" id="btn-brake">REV</div>
        <div class="touch-btn gas" id="btn-gas">GAS</div>
      </div>
    </div>

    <div class="keyboard-hint">PC: [W / ↑] Gas | [S / ↓] Brake | [A / ←] Left | [D / →] Right</div>
    <button id="btn-rematch" class="btn-action hidden" style="margin-top: 10px; max-width: 200px;">Race Again</button>
  </div>

  <!-- Firebase Modular Scripts -->
  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { getAuth, signInAnonymously } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";
    import { 
      getDatabase, ref, set, get, update, onValue, onDisconnect 
    } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-database.js";

    // Your Firebase Configuration
    const firebaseConfig = {
      apiKey: "AIzaSyBzLchy5M2fLne4c7Ghw1KNN8wVrlZdd8M",
      authDomain: "friendsgame-872f5.firebaseapp.com",
      databaseURL: "https://friendsgame-872f5-default-rtdb.firebaseio.com",
      projectId: "friendsgame-872f5",
      storageBucket: "friendsgame-872f5.firebasestorage.app",
      messagingSenderId: "522534013233",
      appId: "1:522534013233:web:f5faa6e6795023d0420810",
      measurementId: "G-PW5H3G97QR"
    };

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    const db = getDatabase(app);

    let myUid = null;
    let roomCode = null;
    let playerRole = null; // "p1" or "p2"

    signInAnonymously(auth).then(cred => {
      myUid = cred.user.uid;
    });

    // UI Elements
    const tabCreate = document.getElementById("tab-create");
    const tabJoin = document.getElementById("tab-join");
    const secCreate = document.getElementById("section-create");
    const secJoin = document.getElementById("section-join");
    const secWaiting = document.getElementById("section-waiting");
    const showCode = document.getElementById("show-room-code");
    const lobbyPanel = document.getElementById("lobby-panel");
    const gameContainer = document.getElementById("game-container");
    const hudName = document.getElementById("hud-name");
    const hudVehicle = document.getElementById("hud-vehicle");
    const hudSpeed = document.getElementById("hud-speed");
    const hudLap = document.getElementById("hud-lap");
    const btnRematch = document.getElementById("btn-rematch");
    const canvas = document.getElementById("raceTrack");
    const ctx = canvas.getContext("2d");

    tabCreate.onclick = () => {
      tabCreate.classList.add("active");
      tabJoin.classList.remove("active");
      secCreate.classList.remove("hidden");
      secJoin.classList.add("hidden");
      secWaiting.classList.add("hidden");
    };
    tabJoin.onclick = () => {
      tabJoin.classList.add("active");
      tabCreate.classList.remove("active");
      secJoin.classList.remove("hidden");
      secCreate.classList.add("hidden");
      secWaiting.classList.add("hidden");
    };

    function randomCode() {
      const set = "ABCDEFGHJKLMNPQRSTUVWXYZ23456789";
      let code = "";
      for (let i = 0; i < 4; i++) code += set[Math.floor(Math.random() * set.length)];
      return code;
    }

    const SPECS = {
      car: { accel: 0.12, maxSpeed: 4.8, turnSpeed: 0.045, friction: 0.98 },
      bike: { accel: 0.16, maxSpeed: 4.4, turnSpeed: 0.065, friction: 0.97 }
    };

    const localDriver = {
      x: 440,
      y: 425,
      angle: 0,
      speed: 0,
      lap: 1,
      passedHalfway: false,
      type: "car",
      name: "Player"
    };

    let opponentDriver = null;
    let roomStatus = "waiting";
    let winner = null;

    // Controls System (Both Keyboard & Touch)
    const keys = { forward: false, backward: false, left: false, right: false };

    // Keyboard handlers
    window.addEventListener("keydown", (e) => {
      if (e.key === "w" || e.key === "W" || e.key === "ArrowUp") keys.forward = true;
      if (e.key === "s" || e.key === "S" || e.key === "ArrowDown") keys.backward = true;
      if (e.key === "a" || e.key === "A" || e.key === "ArrowLeft") keys.left = true;
      if (e.key === "d" || e.key === "D" || e.key === "ArrowRight") keys.right = true;
    });
    window.addEventListener("keyup", (e) => {
      if (e.key === "w" || e.key === "W" || e.key === "ArrowUp") keys.forward = false;
      if (e.key === "s" || e.key === "S" || e.key === "ArrowDown") keys.backward = false;
      if (e.key === "a" || e.key === "A" || e.key === "ArrowLeft") keys.left = false;
      if (e.key === "d" || e.key === "D" || e.key === "ArrowRight") keys.right = false;
    });

    // Touch handlers for mobile
    function setupTouchBtn(elementId, keyProp) {
      const btn = document.getElementById(elementId);
      const start = (e) => { e.preventDefault(); keys[keyProp] = true; btn.classList.add("active"); };
      const end = (e) => { e.preventDefault(); keys[keyProp] = false; btn.classList.remove("active"); };

      btn.addEventListener("touchstart", start, { passive: false });
      btn.addEventListener("touchend", end, { passive: false });
      btn.addEventListener("touchcancel", end, { passive: false });
      btn.addEventListener("mousedown", start);
      btn.addEventListener("mouseup", end);
      btn.addEventListener("mouseleave", end);
    }

    setupTouchBtn("btn-left", "left");
    setupTouchBtn("btn-right", "right");
    setupTouchBtn("btn-gas", "forward");
    setupTouchBtn("btn-brake", "backward");

    // Matchmaking: Create
    document.getElementById("btn-create").onclick = async () => {
      if (!myUid) return alert("Establishing server connection...");
      const name = document.getElementById("create-name").value.trim() || "Host";
      const vehicle = document.getElementById("create-vehicle").value;
      roomCode = randomCode();
      playerRole = "p1";

      localDriver.type = vehicle;
      localDriver.name = name;
      localDriver.x = 440;
      localDriver.y = 425;
      localDriver.angle = 0;

      const roomRef = ref(db, `race_lobbies/${roomCode}`);
      await set(roomRef, {
        status: "waiting",
        winner: null,
        p1: { name, type: vehicle, x: localDriver.x, y: localDriver.y, angle: 0, speed: 0, lap: 1 }
      });

      secCreate.classList.add("hidden");
      secWaiting.classList.remove("hidden");
      showCode.textContent = roomCode;

      listenToRoom(roomCode);
    };

    // Matchmaking: Join
    document.getElementById("btn-join").onclick = async () => {
      if (!myUid) return alert("Establishing server connection...");
      const code = document.getElementById("join-code").value.trim().toUpperCase();
      const name = document.getElementById("join-name").value.trim() || "Challenger";
      const vehicle = document.getElementById("join-vehicle").value;

      if (code.length !== 4) return alert("Please enter a 4-letter code");

      const roomRef = ref(db, `race_lobbies/${code}`);
      const snap = await get(roomRef);

      if (!snap.exists()) return alert("Room does not exist.");
      const data = snap.val();
      if (data.p2) return alert("Match is already full.");

      roomCode = code;
      playerRole = "p2";

      localDriver.type = vehicle;
      localDriver.name = name;
      localDriver.x = 440;
      localDriver.y = 455;
      localDriver.angle = 0;

      await update(roomRef, {
        status: "racing",
        p2: { name, type: vehicle, x: localDriver.x, y: localDriver.y, angle: 0, speed: 0, lap: 1 }
      });

      listenToRoom(roomCode);
    };

    // Firebase Listener
    function listenToRoom(code) {
      const roomRef = ref(db, `race_lobbies/${code}`);
      const myRef = ref(db, `race_lobbies/${code}/${playerRole}/connected`);
      onDisconnect(myRef).set(false);

      onValue(roomRef, (snapshot) => {
        const data = snapshot.val();
        if (!data) return;

        roomStatus = data.status;
        winner = data.winner;

        const oppKey = playerRole === "p1" ? "p2" : "p1";
        if (data[oppKey]) opponentDriver = data[oppKey];

        if (data.status === "racing" && lobbyPanel.style.display !== "none") {
          lobbyPanel.style.display = "none";
          gameContainer.style.display = "flex";
          hudName.textContent = localDriver.name;
          hudVehicle.textContent = localDriver.type.toUpperCase();
        }

        if (data.status === "ended") {
          btnRematch.classList.remove("hidden");
        }
      });
    }

    // Rematch
    btnRematch.onclick = async () => {
      const roomRef = ref(db, `race_lobbies/${roomCode}`);
      localDriver.x = 440;
      localDriver.y = playerRole === "p1" ? 425 : 455;
      localDriver.angle = 0;
      localDriver.speed = 0;
      localDriver.lap = 1;
      localDriver.passedHalfway = false;

      await update(roomRef, {
        status: "racing",
        winner: null,
        [`${playerRole}/x`]: localDriver.x,
        [`${playerRole}/y`]: localDriver.y,
        [`${playerRole}/angle`]: 0,
        [`${playerRole}/speed`]: 0,
        [`${playerRole}/lap`]: 1
      });
      btnRematch.classList.add("hidden");
    };

    // Physics Engine & Realtime Syncer
    let lastNetworkSync = 0;

    function updatePhysics() {
      if (roomStatus !== "racing") return;

      const spec = SPECS[localDriver.type];

      // Acceleration & Braking
      if (keys.forward) localDriver.speed += spec.accel;
      if (keys.backward) localDriver.speed -= spec.accel * 0.7;

      // Friction
      localDriver.speed *= spec.friction;
      if (localDriver.speed > spec.maxSpeed) localDriver.speed = spec.maxSpeed;
      if (localDriver.speed < -spec.maxSpeed * 0.4) localDriver.speed = -spec.maxSpeed * 0.4;

      // Steering
      if (Math.abs(localDriver.speed) > 0.1) {
        const dir = localDriver.speed > 0 ? 1 : -1;
        if (keys.left) localDriver.angle -= spec.turnSpeed * dir;
        if (keys.right) localDriver.angle += spec.turnSpeed * dir;
      }

      // Movement
      localDriver.x += Math.cos(localDriver.angle) * localDriver.speed;
      localDriver.y += Math.sin(localDriver.angle) * localDriver.speed;

      // Halfway Checkpoint (Left curve)
      if (localDriver.x < 200) localDriver.passedHalfway = true;

      // Lap completion crossing finish line (bottom straightaway)
      if (localDriver.passedHalfway && localDriver.x >= 440 && localDriver.y > 380) {
        localDriver.passedHalfway = false;
        localDriver.lap += 1;
        hudLap.textContent = `${Math.min(localDriver.lap, 3)}/3`;

        if (localDriver.lap > 3) {
          update(ref(db, `race_lobbies/${roomCode}`), {
            status: "ended",
            winner: localDriver.name
          });
        }
      }

      // Boundaries
      localDriver.x = Math.max(30, Math.min(canvas.width - 30, localDriver.x));
      localDriver.y = Math.max(30, Math.min(canvas.height - 30, localDriver.y));

      // Network sync (every 45ms)
      const now = performance.now();
      if (now - lastNetworkSync > 45 && roomCode) {
        lastNetworkSync = now;
        update(ref(db, `race_lobbies/${roomCode}/${playerRole}`), {
          x: localDriver.x,
          y: localDriver.y,
          angle: localDriver.angle,
          speed: localDriver.speed,
          lap: localDriver.lap
        });
      }

      hudSpeed.textContent = Math.round(Math.abs(localDriver.speed) * 28);
    }

    // Render Canvas
    function draw() {
      // Infield Grass
      ctx.fillStyle = "#15803d";
      ctx.fillRect(0, 0, canvas.width, canvas.height);

      // Track Outer Oval
      ctx.fillStyle = "#1e293b";
      ctx.beginPath();
      ctx.roundRect(50, 50, canvas.width - 100, canvas.height - 100, 140);
      ctx.fill();

      // Track Inner Grass Island
      ctx.fillStyle = "#15803d";
      ctx.beginPath();
      ctx.roundRect(190, 160, canvas.width - 380, canvas.height - 320, 80);
      ctx.fill();

      // Center Line
      ctx.strokeStyle = "rgba(255, 255, 255, 0.25)";
      ctx.lineWidth = 2;
      ctx.setLineDash([12, 12]);
      ctx.beginPath();
      ctx.roundRect(120, 105, canvas.width - 240, canvas.height - 210, 110);
      ctx.stroke();
      ctx.setLineDash([]);

      // Checkered Finish Line (x = 440)
      for (let r = 0; r < 5; r++) {
        for (let c = 0; c < 2; c++) {
          ctx.fillStyle = (r + c) % 2 === 0 ? "#ffffff" : "#000000";
          ctx.fillRect(440 + c * 10, 360 + r * 16, 10, 16);
        }
      }

      // Draw Opponent
      if (opponentDriver) {
        drawVehicle(
          opponentDriver.x, 
          opponentDriver.y, 
          opponentDriver.angle, 
          opponentDriver.type, 
          opponentDriver.name, 
          playerRole === "p1" ? "#ef4444" : "#38bdf8"
        );
      }

      // Draw Local Player
      drawVehicle(
        localDriver.x, 
        localDriver.y, 
        localDriver.angle, 
        localDriver.type, 
        `${localDriver.name} (You)`, 
        playerRole === "p1" ? "#38bdf8" : "#ef4444"
      );

      // Winner Modal
      if (roomStatus === "ended") {
        ctx.fillStyle = "rgba(9, 13, 22, 0.85)";
        ctx.fillRect(0, 0, canvas.width, canvas.height);

        ctx.fillStyle = "#facc15";
        ctx.font = "bold 38px system-ui";
        ctx.textAlign = "center";
        ctx.fillText(`🏁 ${winner} WINS!`, canvas.width / 2, canvas.height / 2 - 10);

        ctx.font = "16px system-ui";
        ctx.fillStyle = "#f8fafc";
        ctx.fillText("Click 'Race Again' below to reset", canvas.width / 2, canvas.height / 2 + 30);
      }
    }

    function drawVehicle(x, y, angle, type, label, color) {
      ctx.save();
      ctx.translate(x, y);
      ctx.rotate(angle);

      if (type === "car") {
        ctx.fillStyle = color;
        ctx.beginPath();
        ctx.roundRect(-16, -9, 32, 18, 4);
        ctx.fill();

        ctx.fillStyle = "#090d16";
        ctx.fillRect(-2, -7, 10, 14);

        ctx.fillStyle = "#fef08a";
        ctx.fillRect(14, -8, 3, 4);
        ctx.fillRect(14, 4, 3, 4);

        ctx.fillStyle = "#000";
        ctx.fillRect(-12, -12, 8, 3);
        ctx.fillRect(6, -12, 8, 3);
        ctx.fillRect(-12, 9, 8, 3);
        ctx.fillRect(6, 9, 8, 3);
      } else {
        ctx.fillStyle = color;
        ctx.fillRect(-12, -3, 24, 6);

        ctx.fillStyle = "#000";
        ctx.fillRect(-14, -2, 6, 4);
        ctx.fillRect(8, -2, 6, 4);

        ctx.fillStyle = "#ffffff";
        ctx.beginPath();
        ctx.arc(0, 0, 5, 0, Math.PI * 2);
        ctx.fill();
      }

      ctx.restore();

      // Label
      ctx.save();
      ctx.font = "bold 11px system-ui";
      ctx.textAlign = "center";
      ctx.fillStyle = "#ffffff";
      ctx.shadowColor = "rgba(0,0,0,0.8)";
      ctx.shadowBlur = 4;
      ctx.fillText(label, x, y - 20);
      ctx.restore();
    }

    function loop() {
      updatePhysics();
      draw();
      requestAnimationFrame(loop);
    }
    loop();
  </script>
</body>
</html>
